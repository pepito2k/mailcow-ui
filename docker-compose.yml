services:
  mailcow-ui:
    build: .
    restart: unless-stopped
    # Values come from your shell, a .env file next to this file, or your
    # hosting platform's environment settings (Coolify shows these as inputs).
    environment:
      MAILCOW_URL: ${MAILCOW_URL}
      MAILCOW_API_KEY: ${MAILCOW_API_KEY}
      MAILCOW_TLS_INSECURE: ${MAILCOW_TLS_INSECURE:-0}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      UPDATE_CHECK: ${UPDATE_CHECK:-1}
    expose:
      - "3000"
    # For a plain Docker host (no Coolify/Traefik), publish it locally and put
    # your own reverse proxy with HTTPS in front:
    # ports:
    #   - "127.0.0.1:3000:3000"
